name: fetivi
services:
  postgres:
    image: postgis/postgis:16-3.6
    environment:
      POSTGRES_USER: fetivi
      POSTGRES_PASSWORD: fetivi
      POSTGRES_DB: fetivi
    ports:
      - "${FETIVI_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fetivi -d fetivi"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
volumes:
  pgdata:
