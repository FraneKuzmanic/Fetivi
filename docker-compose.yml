name: fetivi
services:
  postgres:
    image: postgis/postgis:16-3.6
    # The test suite runs every file on its own database in parallel (pools, pg-boss, servers).
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: fetivi
      POSTGRES_PASSWORD: fetivi
      POSTGRES_DB: fetivi
    ports:
      - "${FETIVI_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fetivi -d fetivi"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  # Traces from the four server processes (docs/observability.md). Jaeger v2 is an OpenTelemetry
  # Collector distribution: it takes OTLP directly. In-memory: traces go when it restarts.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP over HTTP
volumes:
  pgdata:
